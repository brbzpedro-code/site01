<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Um convite especial</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; overflow: hidden; font-family: Arial, Helvetica, sans-serif;
      color: #fff7fb;
      background: radial-gradient(circle at top, #512449 0%, #211326 48%, #100d18 100%);
    }
    .card {
      width: min(560px, 100%); text-align: center; padding: 42px 26px 36px;
      border: 1px solid rgba(255,255,255,.16); border-radius: 28px;
      background: rgba(255,255,255,.075); box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(12px); position: relative;
    }
    .eyebrow { color: #f5b9d8; letter-spacing: .22em; text-transform: uppercase; font-size: 11px; }
    h1 { font-size: clamp(27px, 6vw, 42px); line-height: 1.13; margin: 18px 0 14px; }
    p { color: #e7d8e5; line-height: 1.6; margin: 0 auto; max-width: 390px; }
    .heart { font-size: 34px; margin: 18px 0 8px; animation: pulse 1.5s infinite; }
    .buttons {
      margin: 30px auto 0; min-height: 118px; max-width: 360px; position: relative;
      display: flex; align-items: center; justify-content: center; gap: 18px;
    }
    button {
      border: 0; border-radius: 999px; padding: 14px 27px; font-size: 16px;
      font-weight: 800; cursor: pointer; box-shadow: 0 8px 22px rgba(0,0,0,.25);
      transition: transform .15s ease, background .15s ease;
    }
    #yes { color: #311526; background: #ffb9d9; z-index: 2; }
    #yes:hover { transform: scale(1.06); background: #ffd2e7; }
    #no {
      color: white; background: #5c5263; position: absolute; left: calc(50% + 62px);
      top: 42px; white-space: nowrap; z-index: 3; touch-action: manipulation;
    }
    .hint { margin-top: 12px; font-size: 12px; color: #bdaabd; }
    .success { display: none; margin-top: 24px; padding: 20px; border-radius: 18px; background: rgba(255,185,217,.12); border: 1px solid rgba(255,185,217,.3); }
    .success h2 { margin: 0 0 10px; font-size: 25px; }
    .success p { color: #fff0f7; }
    .sparkle { position: fixed; pointer-events: none; opacity: .55; color: #ffb9d9; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @media (max-width: 420px) {
      .card { padding: 34px 18px 28px; }
      .buttons { min-height: 140px; }
      #no { left: calc(50% + 48px); top: 48px; }
      button { padding: 13px 22px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <span class="sparkle" style="top:12%;left:12%;font-size:24px">✦</span>
  <span class="sparkle" style="top:20%;right:14%;font-size:18px">✧</span>
  <span class="sparkle" style="bottom:14%;left:17%;font-size:20px">✧</span>
  <main class="card">
    <div class="eyebrow">Tenho uma pergunta pra você</div>
    <div class="heart">💌</div>
    <h1>JÁ SABE SE VAI COMIGO AO CASAMENTO?</h1>
    <p>Preciso confirmar uma companhia muito especial… e pensei em você. 👀</p>

    <div class="buttons" id="play-area">
      <button id="yes" type="button">SIM ❤️</button>
      <button id="no" type="button" aria-label="Não (botão brincalhão)">NÃO 😈</button>
    </div>
    <div class="hint" id="hint">Pode tentar… se conseguir 😏</div>

    <section class="success" id="success" aria-live="polite">
      <h2>EU SABIA! 🥹❤️</h2>
      <p>Então tá combinado! Você vai comigo ao casamento. Já posso contar com a minha companhia favorita? ✨</p>
    </section>
  </main>

  <script>
    const noButton = document.getElementById('no');
    const yesButton = document.getElementById('yes');
    const area = document.getElementById('play-area');
    const success = document.getElementById('success');
    const hint = document.getElementById('hint');

    function escapeNo() {
      const areaRect = area.getBoundingClientRect();
      const btnRect = noButton.getBoundingClientRect();
      const maxX = Math.max(0, areaRect.width - btnRect.width);
      const maxY = Math.max(0, areaRect.height - btnRect.height);
      let x, y, tries = 0;
      do {
        x = Math.random() * maxX;
        y = Math.random() * maxY;
        tries++;
      } while (tries < 12 && Math.hypot(
        x - (btnRect.left - areaRect.left),
        y - (btnRect.top - areaRect.top)
      ) < 100);

      noButton.style.left = x + 'px';
      noButton.style.top = y + 'px';
    }

    // Faz o botão fugir antes de o cursor ou o toque chegar nele.
    noButton.addEventListener('pointerenter', escapeNo);
    noButton.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      escapeNo();
    });
    noButton.addEventListener('click', (event) => {
      event.preventDefault();
      escapeNo();
    });
    noButton.addEventListener('touchstart', (event) => {
      event.preventDefault();
      escapeNo();
    }, { passive: false });

    yesButton.addEventListener('click', () => {
      success.style.display = 'block';
      hint.textContent = 'A resposta certa! ❤️';
      yesButton.textContent = 'COMBINADO! 💖';
      noButton.style.display = 'none';
      area.style.minHeight = '72px';
      success.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    window.addEventListener('resize', () => {
      noButton.style.left = 'calc(50% + 62px)';
      noButton.style.top = '42px';
    });
  </script>
</body>
</html>
